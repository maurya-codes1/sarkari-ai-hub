services:
  - type: web
    name: sarkari-ai-hub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node --max-old-space-size=256 --expose-gc server.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=256 --expose-gc
